name: Publish Nuget

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:  # This line enables manual dispatch

jobs:
  build:
    environment:
      name: production
      
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Publish
      run: dotnet publish -c Release

    - name: Copy Readme
      run: cp README.md ./Formula.SimpleRepo/README.md

    - name: Pack
      run: dotnet pack ./Formula.SimpleRepo/Formula.SimpleRepo.csproj --configuration Release --no-build

    - name: Publish NuGet package
      run: dotnet nuget push "./Formula.SimpleRepo/bin/Release/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
